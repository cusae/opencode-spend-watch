name: Feature request
description: Propose a change to the watcher, checks, or documentation.
title: "[feature]: "
labels: ["enhancement"]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What is missing or painful today?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposal
      description: What should change, and how would it behave?
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
    validations:
      required: false
  - type: checkboxes
    id: confirm
    attributes:
      label: Checklist
      options:
        - label: I checked the existing issues and pull requests.
          required: true
        - label: This request contains no secret or account identifier.
          required: true

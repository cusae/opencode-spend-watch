name: tests

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: quality
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-dev.txt

      - name: Install the development tools
        run: python -m pip install -r requirements-dev.txt

      - name: Lint Python
        run: ruff check .

      - name: Check Python formatting
        run: ruff format --check .

      - name: Validate metadata
        run: python -m json.tool metadata.json >/dev/null

      - name: Type-check
        run: mypy watch.py notify.py providers.py configmerge.py

      - name: Compile
        run: python -m py_compile watch.py notify.py providers.py configmerge.py

      - name: Run the tests with coverage
        run: |
          coverage run -m unittest discover -s test/python -t . -v
          coverage report
          coverage report --format=markdown >> "$GITHUB_STEP_SUMMARY"
          coverage xml

      - uses: actions/upload-artifact@v7
        with:
          name: coverage
          path: |
            .coverage
            coverage.xml
          if-no-files-found: error

      - name: Lint YAML
        run: yamllint -c .yamllint.yml .github

      - name: Lint the workflows
        uses: raven-actions/actionlint@v2

      - name: Lint Markdown
        uses: DavidAnson/markdownlint-cli2-action@v25
        with:
          globs: "**/*.md"

      - name: Ensure no local configuration is committed
        run: |
          test ! -e config.env
          test ! -e state

  tests:
    name: tests (${{ matrix.python }})
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        python: ["3.10", "3.11", "3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python }}

      - name: Compile
        run: python -m py_compile watch.py notify.py providers.py configmerge.py

      - name: Run the tests
        run: python -m unittest discover -s test/python -t . -v

  bats:
    name: bats
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Install the shell tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq bats shellcheck

      - name: Run the shell tests
        run: bats test/shell

  shellcheck:
    name: shellcheck
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Install shellcheck
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq shellcheck

      - name: Run shellcheck
        run: shellcheck install.sh .githooks/commit-msg packaging/opencode-spend-watch
